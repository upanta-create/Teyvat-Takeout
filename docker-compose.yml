version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Database Tier: MongoDB
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0-jammy
    container_name: teyvat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: teyvat_takeout
    volumes:
      - mongodb_data:/data/db
    networks:
      - teyvat-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Cache Tier: Redis — Distributed in-memory caching layer
  # -------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: teyvat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - teyvat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 3. Backend Tier: Express REST API with Prometheus RED metrics
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teyvat-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongodb:27017/teyvat_takeout
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=teyvat_takeout_super_secret_jwt_key_2026
      - SALT=10
      - STRIPE_SECRET_KEY=sk_test_placeholder_key
      - FRONTEND_URL=http://localhost:5173
      - LOG_LEVEL=info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - teyvat-network

  # -------------------------------------------------------------
  # 3. Frontend Tier: Customer React Web SPA
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:4000
    container_name: teyvat-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - teyvat-network

  # -------------------------------------------------------------
  # 4. Admin Tier: Kitchen Operations & Management Portal
  # -------------------------------------------------------------
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:4000
    container_name: teyvat-admin
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - teyvat-network

  # -------------------------------------------------------------
  # 5. Observability Tier: Prometheus Server
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: teyvat-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - teyvat-network

  # -------------------------------------------------------------
  # 6. Visualization Tier: Grafana Dashboards
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.0
    container_name: teyvat-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - teyvat-network

networks:
  teyvat-network:
    driver: bridge

volumes:
  mongodb_data:
  backend_uploads:
  redis_data:
  prometheus_data:
  grafana_data:
