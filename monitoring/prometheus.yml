global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Scrape Teyvat Takeout Express API Metrics
  - job_name: "teyvat-backend-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:4000"]
        labels:
          environment: "local-compose"
          service: "backend-api"

  # Self-monitor Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
