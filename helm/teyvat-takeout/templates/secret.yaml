{{- if and .Values.backend.secrets.create (empty .Values.backend.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teyvat-takeout.fullname" . }}-secrets
  labels:
    {{- include "teyvat-takeout.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_URL: {{ .Values.backend.secrets.mongoUrl | quote }}
  REDIS_URL: {{ .Values.backend.secrets.redisUrl | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.jwtSecret | quote }}
  STRIPE_SECRET_KEY: {{ .Values.backend.secrets.stripeSecretKey | quote }}
  {{- if .Values.backend.secrets.smtpHost }}
  SMTP_HOST: {{ .Values.backend.secrets.smtpHost | quote }}
  SMTP_PORT: {{ .Values.backend.secrets.smtpPort | quote }}
  SMTP_USER: {{ .Values.backend.secrets.smtpUser | quote }}
  SMTP_PASS: {{ .Values.backend.secrets.smtpPass | quote }}
  {{- end }}
{{- end }}
