name: Teyvat Takeout CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/teyvat-takeout

jobs:
  # -------------------------------------------------------------
  # Stage 1: Quality Gate & Automated Testing
  # -------------------------------------------------------------
  test-and-lint:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            admin/package-lock.json

      - name: Backend Syntax & Unit Verification
        run: |
          cd backend
          npm ci
          npm run test

      - name: Frontend Build Verification
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Admin Portal Build Verification
        run: |
          cd admin
          npm ci
          npm run build

  # -------------------------------------------------------------
  # Stage 2: Container Security & CVE Scanning (Trivy)
  # -------------------------------------------------------------
  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-zero in hard gate production

  # -------------------------------------------------------------
  # Stage 3: Multi-Stage Docker Build & Registry Push
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Multi-Stage Container Images
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Build & Push Frontend SPA Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Build & Push Admin SPA Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:${{ github.sha }}

  # -------------------------------------------------------------
  # Stage 4: Continuous Deployment to Amazon EKS
  # -------------------------------------------------------------
  deploy-to-eks:
    name: Zero-Downtime Rollout to Amazon EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        continue-on-error: true # Allows testing pipeline in sandbox without active AWS credentials

      - name: Update Kubeconfig
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME || 'teyvat-takeout-eks' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }}
            kubectl apply -f k8s/namespace.yaml
            kubectl apply -f k8s/configmap.yaml
            kubectl set image deployment/teyvat-backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} -n teyvat-takeout
            kubectl rollout status deployment/teyvat-backend -n teyvat-takeout
          else
            echo "Skipping EKS deployment step: AWS credentials not configured in secrets."
          fi
