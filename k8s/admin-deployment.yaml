apiVersion: apps/v1
kind: Deployment
metadata:
  name: teyvat-admin
  namespace: teyvat-takeout
  labels:
    app: teyvat-admin
    tier: admin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: teyvat-admin
  template:
    metadata:
      labels:
        app: teyvat-admin
        tier: admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/upanta-create/teyvat-takeout-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
